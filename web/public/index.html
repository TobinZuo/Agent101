        <section class="experiment-bar" aria-label="实验控制 / Experiment controls"><div class="task"><span class="task-icon"><svg class="icon"><use href="#i-terminal"/></svg></span><div><span class="task-label" data-i18n="task"></span><strong id="task-title"></strong><code id="task-command"></code></div></div><div class="experiment-controls"><div id="mode-group" class="segmented" role="group" aria-label="运行方式 / Run mode"><button data-mode="live" aria-pressed="true" data-i18n="live" disabled></button><button data-mode="replay" aria-pressed="false" data-i18n="replay" disabled></button></div><button id="start" class="button primary" disabled><svg class="icon"><use href="#i-play"/></svg><span data-i18n="start"></span></button><button id="stop" class="button outline" disabled><svg class="icon"><use href="#i-stop"/></svg><span data-i18n="stop"></span></button></div></section>

        </div>
